<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pratibha Ultimate Love 💋</title>

<style>
body{
margin:0;
overflow:hidden;
background:linear-gradient(270deg,#ff9acb,#ff4da6,#cc0066);
background-size:600% 600%;
animation:bgMove 12s ease infinite;
font-family:sans-serif;
color:white;
text-align:center;
transition:0.5s;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

h1{margin-top:20px;text-shadow:0 0 20px white;}

.photo{
width:230px;height:230px;border-radius:50%;
border:6px solid white;object-fit:cover;
box-shadow:0 0 50px white;margin-top:20px;
cursor:pointer;animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-20px);}
}

.section{position:absolute;bottom:130px;width:100%;display:none;}

button{
padding:12px 25px;margin:10px;border:none;
border-radius:25px;background:white;
color:#ff4da6;font-weight:bold;
cursor:pointer;transition:0.2s;
}

.message{
position:absolute;bottom:40px;width:100%;
display:none;font-size:18px;padding:0 20px;
}

.ring{
position:absolute;top:50%;left:50%;
transform:translate(-50%,-50%);
font-size:80px;display:none;
animation:spin 2s linear infinite;
}

@keyframes spin{
from{transform:translate(-50%,-50%) rotate(0deg);}
to{transform:translate(-50%,-50%) rotate(360deg);}
}

.memoryBtn{display:none;margin-top:20px;}

.memoriesPage{
position:fixed;top:0;left:0;width:100%;height:100%;
background:black;color:white;display:none;
overflow:auto;padding:20px;
}

.memoryPhoto{
width:100%;max-width:250px;border-radius:15px;
margin:15px auto;display:block;
box-shadow:0 0 20px pink;
}
</style>
</head>

<body>

<!-- Background Music -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mp3">
</audio>

<!-- Kiss Sound -->
<audio id="kissSound">
  <source src="kiss.mp3" type="audio/mp3">
</audio>

<h1>Happy Kiss Day My Chikku 💋</h1>

<img src="pratibha.jpg" class="photo" onclick="startLove()">

<div class="section" id="trickSection">
<p>Will you kiss me back? 😘</p>
<button onclick="yesLove()">YES 😘</button>
<button id="noBtn" onclick="fakeError()" onmouseover="moveNo()">NO 😈</button>
</div>

<div class="ring" id="ring">💍</div>

<div class="message" id="finalMsg">
She chose YES 😭💖<br>
Forever sealed with kisses 💋<br>
<button class="memoryBtn" id="memoryBtn" onclick="openMemories()">Our Memories 💞</button>
</div>

<div class="memoriesPage" id="memoriesPage">
<h2>Our Beautiful Memories 🌌</h2>

<img src="memory1.jpg" class="memoryPhoto">
<img src="memory2.jpg" class="memoryPhoto">
<img src="memory3.jpg" class="memoryPhoto">

<br>
<button onclick="closeMemories()">Close</button>
</div>

<script>

let noSize=1;

// Start Love (music starts here for iPhone compatibility)
function startLove(){
document.getElementById("trickSection").style.display="block";
document.getElementById("bgMusic").play();
}

// YES button
function yesLove(){
document.getElementById("trickSection").style.display="none";
document.getElementById("finalMsg").style.display="block";
document.getElementById("ring").style.display="block";
document.getElementById("kissSound").play();
document.body.style.background="black";

setTimeout(()=>{
document.getElementById("memoryBtn").style.display="inline-block";
},10000);
}

// NO button runs and shrinks
function moveNo(){
let btn=document.getElementById("noBtn");
btn.style.position="absolute";
btn.style.left=Math.random()*80+"vw";
btn.style.top=Math.random()*60+"vh";
noSize-=0.1;
if(noSize<0.4) noSize=0.4;
btn.style.transform="scale("+noSize+")";
}

function fakeError(){
alert("ERROR 404: 'NO' does not exist 😂💖");
}

function openMemories(){
document.getElementById("memoriesPage").style.display="block";
}

function closeMemories(){
document.getElementById("memoriesPage").style.display="none";
}

</script>

</body>
</html>
